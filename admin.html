<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard | Elevate Global</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    * {box-sizing:border-box;margin:0;padding:0;}
    body {font-family:'Outfit',sans-serif;background:#0a0f1e;color:#cbd5e1;padding:20px;}
    .sidebar {width:250px;position:fixed;top:0;left:0;bottom:0;background:#141c2f;padding:30px 20px;border-right:1px solid rgba(255,255,255,.05);}
    .sidebar h2 {color:#fff;margin-bottom:40px;font-size:1.5rem;font-weight:800;display:flex;align-items:center;gap:10px;}
    .nav-btn {display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;background:none;border:none;color:#94a3b8;font-family:'Outfit',sans-serif;font-size:.95rem;font-weight:600;cursor:pointer;border-radius:10px;text-align:left;margin-bottom:10px;transition:all .3s;}
    .nav-btn:hover, .nav-btn.active {color:#fff;background:rgba(14,165,233,.15);color:#0ea5e9;}
    .main {margin-left:250px;padding:20px 40px;}
    h1 {color:#fff;margin-bottom:30px;font-size:2rem;}
    .tab-content {display:none;}
    .tab-content.active {display:block;}
    .card-grid {display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:40px;}
    .card {background:#141c2f;padding:24px;border-radius:16px;border:1px solid rgba(255,255,255,.05);}
    .card .num {font-size:2.4rem;font-weight:800;background:linear-gradient(135deg,#0ea5e9,#7c3aed);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
    .card .lbl {font-size:.85rem;color:#64748b;margin-top:5px;font-weight:600;}
    table {width:100%;border-collapse:collapse;background:#141c2f;border-radius:14px;overflow:hidden;}
    th {background:rgba(14,165,233,.08);color:#0ea5e9;text-align:left;padding:16px;font-size:.85rem;text-transform:uppercase;}
    td {padding:16px;border-top:1px solid rgba(255,255,255,.05);font-size:.9rem;vertical-align:middle;}
    tr:hover td {background:rgba(255,255,255,.02);}
    .btn {padding:6px 14px;border:none;border-radius:6px;font-family:'Outfit';font-weight:600;cursor:pointer;font-size:.8rem;transition:all .2s;}
    .btn-green {background:rgba(16,185,129,.15);color:#10b981;}
    .btn-green:hover {background:#10b981;color:#fff;}
    .badge {padding:4px 10px;border-radius:50px;font-size:.75rem;}
    .b-pending {background:rgba(245,158,11,.1);color:#f59e0b;}
    .b-paid {background:rgba(14,165,233,.1);color:#0ea5e9;}
    .b-enrolled {background:rgba(16,185,129,.1);color:#10b981;}
    
    .course-card {background:#141c2f;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:24px;margin-bottom:20px;}
    .cc-header {display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
    .cc-header h3 {color:#fff;font-size:1.3rem;}
    .inp {background:#0a0f1e;border:1px solid rgba(255,255,255,.1);color:#fff;padding:10px 14px;border-radius:8px;font-family:'Outfit';width:100%;margin-bottom:10px;}
    .mod-list {list-style:none;margin:16px 0;}
    .mod-list li {background:rgba(255,255,255,.03);padding:10px 14px;border-radius:8px;margin-bottom:8px;font-size:.85rem;display:flex;justify-content:space-between;align-items:center;}
    .mod-list li a {color:#0ea5e9;text-decoration:none;}
  </style>
</head>
<body>

  <div class="sidebar">
    <h2><i class="fas fa-layer-group"></i> Elevate</h2>
    <a href="/" style="color:#64748b;text-decoration:none;font-size:.85rem;margin-bottom:30px;display:block;">← Back to Website</a>
    <button class="nav-btn active" onclick="showTab('dashboard')"><i class="fas fa-chart-pie"></i> Dashboard</button>
    <button class="nav-btn" onclick="showTab('inquiries')"><i class="fas fa-inbox"></i> Inquiries</button>
    <button class="nav-btn" onclick="showTab('courses')"><i class="fas fa-book-open"></i> Course Manager</button>
    <button class="nav-btn" onclick="showTab('users')"><i class="fas fa-users"></i> Users</button>
  </div>

  <div class="main">
    <div id="tab-dashboard" class="tab-content active">
      <h1>Overview</h1>
      <div class="card-grid">
        <div class="card"><div class="num" id="ss-adms">0</div><div class="lbl">Total Enrollments</div></div>
        <div class="card"><div class="num" id="ss-msg">0</div><div class="lbl">Contact Messages</div></div>
        <div class="card"><div class="num" id="ss-users">0</div><div class="lbl">Registered Users</div></div>
      </div>
    </div>

    <div id="tab-inquiries" class="tab-content">
      <h1>Inquiries & Admissions</h1>
      <table id="table-inq">
        <thead>
          <tr><th>ID</th><th>Date</th><th>Name</th><th>Email / Phone</th><th>Program</th><th>Status</th><th>Action</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <div id="tab-courses" class="tab-content">
      <h1>Course Manager (LMS)</h1>
      <div id="courses-container"></div>
    </div>

    <div id="tab-users" class="tab-content">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
        <h1>Registered Users</h1>
        <button class="btn btn-green" onclick="editUser('', '', '')">+ Add New User</button>
      </div>
      
      <div id="user-form" style="display:none;background:rgba(255,255,255,.02);padding:20px;border-radius:12px;margin-bottom:30px;border:1px solid rgba(255,255,255,.1);">
        <h3 id="uf-title" style="margin-bottom:15px;color:#0ea5e9;">Add / Edit User</h3>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-bottom:15px;">
          <div><label style="font-size:.85rem;color:#94a3b8;">Email Address</label><input type="email" id="uf-email" class="inp" placeholder="student@email.com"/></div>
          <div><label style="font-size:.85rem;color:#94a3b8;">Full Name</label><input type="text" id="uf-name" class="inp" placeholder="John Doe"/></div>
          <div><label style="font-size:.85rem;color:#94a3b8;">Password</label><input type="text" id="uf-pass" class="inp" placeholder="Leave empty to keep existing"/></div>
          <div><label style="font-size:.85rem;color:#94a3b8;">Enrolled Courses (comma separated IDs)</label><input type="text" id="uf-courses" class="inp" placeholder="video, photo"/></div>
        </div>
        <div style="display:flex;gap:10px;">
          <button class="btn btn-green" onclick="saveUser()">Save User</button>
          <button class="btn" style="background:#334155;color:#fff;" onclick="document.getElementById('user-form').style.display='none'">Cancel</button>
        </div>
      </div>

      <table id="table-users">
        <thead>
          <tr><th>Email</th><th>Name</th><th>Enrolled Courses</th><th>Action</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <script>
    let db = { submissions: [], courses: {}, users: {} };
    let adminKey = sessionStorage.getItem('adminKey');

    async function loadData() {
      if(!adminKey) {
          adminKey = prompt("Please enter Admin Key (Hint: elevate_admin_2026):");
          if(!adminKey) {
             document.body.innerHTML = '<div style="color:#fff;padding:40px;text-align:center;"><h1>Access Denied</h1><p>Invalid Admin Key. <a href="admin.html" style="color:#0ea5e9;">Try Again</a></p></div>';
             return;
          }
          sessionStorage.setItem('adminKey', adminKey);
      }

      try {
        const r = await fetch(`/api/admin/data?key=${adminKey}`);
        if(r.status === 403) {
            sessionStorage.removeItem('adminKey');
            alert("Invalid Key. Please try again.");
            location.reload();
            return;
        }
        db = await r.json();
        renderDashboard();
      } catch(e) {
        console.error("Failed to fetch admin data", e);
        document.body.innerHTML = '<div style="color:#fff;padding:40px;text-align:center;"><h1>Server Error</h1><p>Could not connect to the backend. Is the server running?</p></div>';
      }
    }

    function showTab(t) {
      document.querySelectorAll('.tab-content').forEach(el=>el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(btn=>btn.classList.remove('active'));
      document.getElementById('tab-'+t).classList.add('active');
      event.currentTarget.classList.add('active');
    }

    function renderDashboard() {
      // stats
      document.getElementById('ss-adms').innerText = db.submissions.filter(s=>s.type==='admission').length;
      document.getElementById('ss-msg').innerText = db.submissions.filter(s=>s.type==='contact').length;
      document.getElementById('ss-users').innerText = Object.keys(db.users).length;

      // Inquiries
      const tblAdms = document.querySelector('#table-inq tbody');
      tblAdms.innerHTML = "";
      db.submissions.slice().reverse().forEach(s => {
        let badge = `<span class="badge b-pending">Pending</span>`;
        if(s.status === 'Paid') badge = `<span class="badge b-paid">Paid</span>`;
        if(s.status === 'Enrolled') badge = `<span class="badge b-enrolled">Enrolled</span>`;
        
        let action = "";
        if(s.type === 'admission' && s.status !== 'Enrolled') {
           action = `<button class="btn btn-green" onclick="markEnrolled('${s.id}')">Enroll Student</button>`;
        }

        tblAdms.innerHTML += `<tr>
          <td>${s.id}</td>
          <td style="color:#64748b;font-size:.8rem;">${s.timestamp}</td>
          <td><b>${s.name}</b><br/><small style="color:#64748b">${s.type.toUpperCase()}</small></td>
          <td>${s.email}<br/><small style="color:#64748b">${s.phone||''}</small></td>
          <td style="max-width:200px;">${s.program||s.subject||'-'}<br/><small style="color:#64748b">${s.message||''}</small></td>
          <td>${badge}</td>
          <td>${action}</td>
        </tr>`;
      });

      // Users
      const tblUsers = document.querySelector('#table-users tbody');
      tblUsers.innerHTML = "";
      Object.keys(db.users).forEach(em => {
        let u = db.users[em];
        let ctags = u.enrolled.map(c=>`<span class="badge b-paid" style="margin-right:5px;">${c}</span>`).join('');
        let crsStr = u.enrolled.join(',');
        tblUsers.innerHTML += `<tr>
          <td>${em}</td>
          <td>${u.name}</td>
          <td>${ctags||'-'}</td>
          <td><button class="btn btn-green" style="padding:4px 8px;font-size:.7rem;" onclick="editUser('${em}', '${u.name}', '${crsStr}')">Edit</button></td>
        </tr>`;
      });

      // Courses
      const cCont = document.getElementById('courses-container');
      cCont.innerHTML = "";
      Object.keys(db.courses).forEach(cid => {
        let c = db.courses[cid];
        let mods = c.modules || [];
        let modHtml = mods.map(m=>`<li><span>${m.title}</span> <a href="${m.link}" target="_blank">View File <i class="fas fa-external-link-alt"></i></a></li>`).join('');

        cCont.innerHTML += `
        <div class="course-card">
          <div class="cc-header">
            <h3>${c.title} <span class="badge b-paid">${cid}</span></h3>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">
            <div>
              <p style="font-size:.85rem;color:#64748b;margin-bottom:8px;">Live Class Link (Google Meet)</p>
              <div style="display:flex;gap:10px;">
                <input type="text" class="inp" id="meet-${cid}" value="${c.meet_link||''}" placeholder="https://meet.google.com/..."/>
                <button class="btn btn-green" style="height:40px;" onclick="updateMeet('${cid}')">Save</button>
              </div>
            </div>
            <div>
              <p style="font-size:.85rem;color:#64748b;margin-bottom:8px;">Add New Module/Note</p>
              <div style="display:flex;gap:10px;margin-bottom:10px;">
                <input type="text" class="inp" id="modT-${cid}" placeholder="Mod Title (e.g. Chapter 1)"/>
                <input type="text" class="inp" id="modL-${cid}" placeholder="URL link to PDF/Video"/>
              </div>
              <button class="btn btn-green" onclick="addModule('${cid}')">Add Module</button>
            </div>
          </div>
          <h4 style="color:#fff;margin-top:24px;font-size:.95rem;border-bottom:1px solid rgba(255,255,255,.05);padding-bottom:10px;">Existing Modules (${mods.length})</h4>
          <ul class="mod-list">${modHtml || '<li style="color:#64748b;">No modules added yet</li>'}</ul>
        </div>
        `;
      });
    }

    async function markEnrolled(id) {
      if(!confirm("Mark this user as Enrolled? This will generate a login for them.")) return;
      await fetch('/api/admin/action', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({action:'mark_enrolled', id:id, key: adminKey})
      });
      loadData();
      alert("User Enrolled Successfully!");
    }

    async function updateMeet(cid) {
      let val = document.getElementById(`meet-${cid}`).value;
      await fetch('/api/admin/course', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({action:'update_meet', course_id:cid, meet_link:val, key: adminKey})
      });
      loadData();
      alert("Meet link updated");
    }

    async function addModule(cid) {
      let t = document.getElementById(`modT-${cid}`).value;
      let l = document.getElementById(`modL-${cid}`).value;
      if(!t || !l) return alert("Please fill title and link");
      await fetch('/api/admin/course', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({action:'add_module', course_id:cid, title:t, link:l, key: adminKey})
      });
      loadData();
      alert("Module added");
    }

    function editUser(em, name, crs) {
      document.getElementById('user-form').style.display = 'block';
      document.getElementById('uf-email').value = em;
      document.getElementById('uf-email').disabled = em ? true : false;
      document.getElementById('uf-name').value = name;
      document.getElementById('uf-pass').value = '';
      document.getElementById('uf-courses').value = crs;
      document.getElementById('uf-title').innerText = em ? "Edit User: " + em : "Add New User";
    }

    async function saveUser() {
      let em = document.getElementById('uf-email').value;
      let name = document.getElementById('uf-name').value;
      let pass = document.getElementById('uf-pass').value;
      let crs = document.getElementById('uf-courses').value.split(',').map(s=>s.trim()).filter(s=>s);
      
      if(!em) return alert("Email is required!");
      
      await fetch('/api/admin/action', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({action:'save_user', email:em, name:name, password:pass, enrolled:crs, key: adminKey})
      });
      document.getElementById('user-form').style.display = 'none';
      loadData();
      alert("User Saved Successfully!");
    }

    loadData();
  </script>
</body>
</html>
