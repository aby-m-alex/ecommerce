<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Login | Elevate Global</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="style.css"/>
  <style>
    body {background:#0a0f1e;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
    .login-box {background:#141c2f;border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:48px;width:100%;max-width:480px;text-align:center;}
    .logo-mark {background:linear-gradient(135deg,#0ea5e9,#7c3aed);color:#fff;width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:900;margin:0 auto 20px;}
    h1 {font-family:'Outfit';color:#fff;font-size:1.8rem;margin-bottom:8px;}
    p.sub {color:#64748b;font-size:.95rem;margin-bottom:32px;}
    .inp-group {text-align:left;margin-bottom:20px;}
    .inp-group label {display:block;color:#cbd5e1;font-size:.85rem;margin-bottom:8px;font-family:'Outfit';font-weight:600;}
    .inp-group input {width:100%;background:#0a0f1e;border:1px solid rgba(255,255,255,.1);color:#fff;padding:14px;border-radius:12px;font-family:'Outfit';outline:none;}
    .inp-group input:focus {border-color:#0ea5e9;}
    .error {color:#ef4444;background:rgba(239,68,68,.1);padding:10px;border-radius:8px;font-size:.85rem;margin-bottom:20px;display:none;}
    .back {display:inline-block;margin-top:24px;color:#0ea5e9;text-decoration:none;font-size:.9rem;font-weight:600;}
  </style>
</head>
<body>

  <div class="login-box">
    <div class="logo-mark">EG</div>
    <h1>Student Portal</h1>
    <p class="sub">Sign in to access your enrolled courses and materials.</p>
    
    <div class="error" id="err-msg">Invalid login credentials.</div>
    
    <form id="login-form">
      <div class="inp-group">
        <label>Email Address</label>
        <input type="email" id="email" required placeholder="your@email.com"/>
      </div>
      <div class="inp-group">
        <label>Password</label>
        <input type="password" id="password" required placeholder="••••••••"/>
      </div>
      <div style="background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.2);padding:12px;border-radius:10px;margin-bottom:24px;font-size:.8rem;color:#f59e0b;text-align:left;">
        <b>Demo Account:</b> abymalex@gmail.com<br/>
        <b>Password:</b> password123
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;" id="lbtn">Sign In</button>
    </form>
    
    <a href="/" class="back">← Back to Website</a>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('lbtn');
      const err = document.getElementById('err-msg');
      btn.innerHTML = 'Signing in...';
      err.style.display = 'none';
      
      const payload = {
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      };
      
      try {
        const r = await fetch('/api/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(payload)
        });
        const res = await r.json();
        if(res.success) {
          window.location.href = '/dashboard.html';
        } else {
          err.innerText = res.message || 'Login failed';
          err.style.display = 'block';
        }
      } catch(e) {
        err.innerText = 'Connection error. The server may be starting up — please wait 5 seconds and try again.';
        err.style.display = 'block';
      }
      btn.innerHTML = 'Sign In';
    });
  </script>
</body>
</html>
